<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211631">
  <meta name="description" content="Narra Affiliate, không gian quản lý chương trình và theo dõi hiệu quả giới thiệu.">
  <title>Narra Affiliate</title>
  <link rel="icon" href="assets/narra-icon.png" type="image/png">
  <link rel="preload" href="assets/narra-poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace.css">
  <script>
    try {
      const preferences = JSON.parse(localStorage.getItem('narra-affiliate-preferences-v1'));
      if (preferences?.theme === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch {}
  </script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <div class="shell" id="shell">
    <aside class="rail" id="rail" aria-label="Điều hướng Narra Affiliate"></aside>
    <div class="workspace" id="workspace">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1"></main>
    </div>
    <button class="scrim" id="scrim" type="button" data-action="close-sidebar" tabindex="-1" aria-label="Đóng thanh điều hướng" hidden></button>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>Vui lòng bật JavaScript để sử dụng Narra Affiliate.</noscript>
</body>
</html>
